<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT NEBULA タレント別楽曲リスト</title>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@1.13.8/css/jquery.dataTables.min.css">
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.8/js/jquery.dataTables.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-fluid page-wrapper">
        <h3>PROJECT NEBULA タレント別楽曲リスト</h3>
        <h5></h5>


        <div class="panel panel-default filter-panel">
            <div class="panel-heading" role="button" data-toggle="collapse" data-target="#talentFilterPanel" aria-expanded="true" aria-controls="talentFilterPanel">
                <span id="talentPanelTitle">タレント</span>
                <span class="glyphicon glyphicon-chevron-up filter-panel-icon" aria-hidden="true"></span>
            </div>
            <div id="talentFilterPanel" class="panel-collapse collapse in">
                <div class="panel-body">
                    <div class="row filter-area">
                        <div class="col-sm-4">
                            <select id="talentFilter" class="form-control">
                                <option value="nina">桃瀬にな</option>
                                <option value="yura">碓氷ゆら</option>
                                <option value="ren">鈴莉れん</option>
                                <option value="hinata">菜鳥ひなた</option>
                                <option value="ruka">紫雨るか</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel panel-default filter-panel">
            <div class="panel-heading" role="button" data-toggle="collapse" data-target="#detailFilterPanel" aria-expanded="true" aria-controls="detailFilterPanel">
                <span id="detailPanelTitle">フィルタ</span>
                <span class="glyphicon glyphicon-chevron-up filter-panel-icon" aria-hidden="true"></span>
            </div>
            <div id="detailFilterPanel" class="panel-collapse collapse in">
                <div class="panel-body">
                    <div class="row filter-area">
                        <div class="col-sm-4">
                            <label>ジャンル</label>
                            <select id="genreFilter" class="form-control">
                                <option value="">すべて</option>
                            </select>
                        </div>

                        <div class="col-sm-4">
                            <label>アーティスト</label>
                            <select id="artistFilter" class="form-control">
                                <option value="">すべて</option>
                            </select>
                        </div>

                        <div class="col-sm-4">
                            <label>種類</label>
                            <select id="typeFilter" class="form-control">
                                <option value="">すべて</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel panel-default filter-panel">
            <div class="panel-heading" role="button" data-toggle="collapse" data-target="#textFilterPanel" aria-expanded="true" aria-controls="textFilterPanel">
                <span id="textPanelTitle">キーワード</span>
                <span class="glyphicon glyphicon-chevron-up filter-panel-icon" aria-hidden="true"></span>
            </div>
            <div id="textFilterPanel" class="panel-collapse collapse in">
                <div class="panel-body">
                    <div class="row filter-area">
                        <div class="col-sm-4">
                            <input type="text" id="textFilter" class="form-control" placeholder="キーワード検索">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-area">
            <table id="grid" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>楽曲</th>
                        <th>アーティスト</th>
                        <th>ジャンル</th>
                    </tr>
                </thead>
            </table>
        </div>
        <footer class="page-footer">
        <small>
            Created by <a href="https://x.com/o2i_5" target="_blank">@o2i_5</a> / Datad by <a href="https://x.com/sr927611" target="_blank">@sr927611</a>
        </small>
        </footer>
    </div>

    <!-- ローディング表示 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <span class="glyphicon glyphicon-refresh spinning"></span>
            <div>読み込み中...</div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="js/script.js"></script>
</body>

</html>
